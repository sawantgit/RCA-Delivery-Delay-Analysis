<svg viewBox="0 0 1640 830" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1640" height="830" fill="#FFFFFF"/>

  <text x="820" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2937">Fishbone Diagram: Why Are Deliveries Late?</text>
  <text x="820" y="62" text-anchor="middle" font-size="14" fill="#6B7280">DataCo Smart Supply Chain dataset, 180,519 orders. Green = proven by the data. Grey = hypothesis needing on-the-ground validation.</text>

  <!-- Spine -->
  <line x1="60" y1="420" x2="1360" y2="420" stroke="#374151" stroke-width="5"/>
  <line x1="60" y1="395" x2="60" y2="445" stroke="#374151" stroke-width="4"/>

  <!-- Head -->
  <polygon points="1360,350 1480,350 1600,420 1480,490 1360,490" fill="#1F2937"/>
  <text x="1465" y="406" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">LATE DELIVERIES</text>
  <text x="1465" y="430" text-anchor="middle" font-size="14" fill="#FDE68A">Network OTIF 42.7%</text>
  <text x="1465" y="450" text-anchor="middle" font-size="11" fill="#D1D5DB">(canceled orders excluded)</text>

  <!-- ========== METHOD (top) ========== -->
  <rect x="50" y="82" width="400" height="38" fill="#4C956C"/>
  <text x="250" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">METHOD</text>
  <line x1="250" y1="236" x2="340" y2="420" stroke="#4C956C" stroke-width="3.5"/>
  <circle cx="64" cy="146" r="6" fill="#2E8B57"/>
  <text x="80" y="151" font-size="13.5" fill="#1F2937">Delivery promise fixed per tier, not per order</text>
  <circle cx="64" cy="176" r="6" fill="#2E8B57"/>
  <text x="80" y="181" font-size="13.5" fill="#1F2937">First Class: promised 1 day, takes 2 (100% of orders)</text>
  <circle cx="64" cy="206" r="6" fill="#2E8B57"/>
  <text x="80" y="211" font-size="13.5" fill="#1F2937">Second Class: promised 2 days, performs like Standard</text>

  <!-- ========== MEASUREMENT (top) ========== -->
  <rect x="500" y="82" width="400" height="38" fill="#E07B39"/>
  <text x="700" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">MEASUREMENT</text>
  <line x1="700" y1="236" x2="790" y2="420" stroke="#E07B39" stroke-width="3.5"/>
  <circle cx="514" cy="146" r="6" fill="#2E8B57"/>
  <text x="530" y="151" font-size="13.5" fill="#1F2937">OTIF formula counted canceled orders as on-time</text>
  <circle cx="514" cy="176" r="6" fill="#2E8B57"/>
  <text x="530" y="181" font-size="13.5" fill="#1F2937">Status labels don't always match actual days</text>

  <!-- ========== MACHINE (top) ========== -->
  <rect x="950" y="82" width="400" height="38" fill="#5B92B0"/>
  <text x="1150" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">MACHINE</text>
  <line x1="1150" y1="236" x2="1240" y2="420" stroke="#5B92B0" stroke-width="3.5"/>
  <circle cx="964" cy="146" r="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="980" y="151" font-size="13.5" font-style="italic" fill="#6B7280">No system flags unachievable tier promises</text>

  <!-- ========== MAN (bottom) ========== -->
  <line x1="460" y1="604" x2="550" y2="420" stroke="#8E7CC3" stroke-width="3.5"/>
  <circle cx="264" cy="642" r="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="280" y="647" font-size="13.5" font-style="italic" fill="#6B7280">Tier promises set without ops / fulfilment input</text>
  <rect x="260" y="700" width="400" height="38" fill="#8E7CC3"/>
  <text x="460" y="726" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">MAN</text>

  <!-- ========== ENVIRONMENT (bottom) ========== -->
  <line x1="940" y1="604" x2="1030" y2="420" stroke="#C0504D" stroke-width="3.5"/>
  <circle cx="744" cy="642" r="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="760" y="647" font-size="13.5" font-style="italic" fill="#6B7280">Carrier capacity may not support 1-day lanes</text>
  <rect x="740" y="700" width="400" height="38" fill="#C0504D"/>
  <text x="940" y="726" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">ENVIRONMENT</text>

  <!-- Legend -->
  <circle cx="60" cy="790" r="7" fill="#2E8B57"/>
  <text x="76" y="795" font-size="14" fill="#1F2937">Data-proven (backed by analysis in rca_analysis.py)</text>
  <circle cx="470" cy="790" r="7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="486" y="795" font-size="14" font-style="italic" fill="#6B7280">Hypothesis (needs validation outside this dataset)</text>
</svg>
